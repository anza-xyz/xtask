name: Release

# Managed by release-plz (https://release-plz.dev).
#
# Every push to master runs two independent tracks:
#
#   - `release-pr` keeps a standing "chore(release): ..." PR in sync with the
#     conventional commits landed since the last release, bumping the version
#     and updating CHANGELOG.md. Merging that PR is what cuts a release.
#   - `check` compares the version in Cargo.toml against the published tags and
#     only then does `release` run: it publishes to crates.io, tags, and creates
#     the GitHub release. Gating `release` behind `check` keeps the `prod`
#     environment from queueing an approval on every unrelated merge.
#
# The version bump policy lives in release-plz.toml.

on:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CRATE_NAME: anza-xtask

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    # Not an approval gate: the environment only scopes the app credentials.
    environment: release-pr
    permissions:
      contents: write # push the release branch
      pull-requests: write # open and update the release PR
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Create github app token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_needed: ${{ steps.meta.outputs.release_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute metadata
        id: meta
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "'"${CRATE_NAME}"'") | .version')"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "Could not resolve version for crate: ${CRATE_NAME}"
            exit 1
          fi

          tag="${CRATE_NAME}@v${version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${tag}, nothing to release." >> "${GITHUB_STEP_SUMMARY}"
            echo "release_needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Tag not found: ${tag}, a release is due." >> "${GITHUB_STEP_SUMMARY}"
            echo "release_needed=true" >> "${GITHUB_OUTPUT}"
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: prod
    needs: check
    if: needs.check.outputs.release_needed == 'true'
    permissions:
      contents: write # create tags and GitHub releases
      pull-requests: read
      id-token: write # crates.io trusted publishing (OIDC)
      attestations: write
      artifact-metadata: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Create github app token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Package crate
        run: cargo package -p "${CRATE_NAME}"

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: target/package/*.crate

      - name: Create crate token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
